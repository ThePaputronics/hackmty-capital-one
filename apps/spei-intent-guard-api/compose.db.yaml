name: spei-intent-guard-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spei
      POSTGRES_PASSWORD: spei
      POSTGRES_DB: spei_intent_guard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - spei-intent-guard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spei -d spei_intent_guard"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  spei-intent-guard-postgres:
