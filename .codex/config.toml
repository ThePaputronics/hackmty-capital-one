[agents]
enabled = true
max_concurrent_threads_per_session = 6

[agents."accessibility"]
description = "Performs read-only accessibility reviews for web interfaces, user flows, keyboard behavior, semantics, and assistive technology support."
config_file = "./agents/accessibility.toml"

[agents."agent-security"]
description = "Reviews AI-agent prompts, tools, permissions, context handling, prompt injection, excessive agency, and model-output safety."
config_file = "./agents/agent-security.toml"

