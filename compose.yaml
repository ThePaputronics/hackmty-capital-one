name: hackathon-hello-world

services:
  web:
    image: "${APP_IMAGE:-hackathon-hello-world}:${APP_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      io.hackathon.project: hello-world
      io.hackathon.managed-by: github-actions
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M

networks:
  default:
    name: hackathon-hello-world
    labels:
      io.hackathon.project: hello-world
      io.hackathon.managed-by: github-actions
